[project]
name = "groundwork"
version = "0.1.0"
description = "GroundWork — production-grade hybrid RAG over U.S. OSHA workplace-safety regulations (29 CFR + OSHA publications)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "GroundWork" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "bm25s>=0.2.6",
    "PyStemmer>=2.2",
    "llama-cpp-python>=0.3.5",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
    "lxml>=5.3",
    "pypdf>=5.1",
    "structlog>=24.4",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
