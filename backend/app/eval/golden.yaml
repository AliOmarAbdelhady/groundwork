# GroundWork golden evaluation dataset.
# Authored against the real corpus (data/processed/sections.jsonl, eCFR issue
# 2026-09-24 + curated OSHA publications). Each in-domain item carries one or
# more ground-truth section roots; metrics are computed at section level.
# `adversarial: true` items are out-of-domain — the system should REFUSE them.

items:
